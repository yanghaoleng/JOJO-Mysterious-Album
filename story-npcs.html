<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3eee2">
  <title>故事里的朋友 · 萌萌星</title>
  <link rel="icon" href="./favicon.ico">
  <link rel="stylesheet" href="./src/story-npcs/gallery.css?v=20260906-npc42">
</head>
<body>
  <header><a id="back" href="./story-v2.html">← 返回故事</a><span>萌萌星 · 角色图鉴</span></header>
  <main>
    <section class="portrait" aria-labelledby="name">
      <div id="preview" role="img" aria-label="可拖动旋转的立体角色"></div>
      <div class="portrait-caption"><p id="family"></p><h1 id="name">故事里的朋友</h1><p id="basis"></p></div>
      <p class="rotate-hint">轻轻拖动，看看另一面</p>
      <div class="turns"><button id="previous" aria-label="上一位朋友">←</button><span id="counter"></span><button id="next" aria-label="下一位朋友">→</button></div>
    </section>
    <section class="details" aria-label="角色设定">
      <p class="eyebrow">在故事里，和你相遇</p>
      <p id="personality"></p>
      <h2>它会这样说</h2><blockquote id="sample"></blockquote>
      <button id="listen" class="listen">听它打个招呼 <span aria-hidden="true">▷</span></button>
      <p id="voice-status" class="status" role="status"></p>
      <details><summary>说话方式与形象设定</summary><p id="style"></p><p id="appearance"></p><p id="adaptation"></p></details>
      <nav class="story-links" aria-label="进入故事"><a href="./dev/?story=doudou">去立体小世界 ↗</a><a href="./story-v2.html">去原版故事 ↗</a></nav>
    </section>
    <section class="friends" aria-label="选择角色">
      <div class="friends-heading"><h2>认识更多朋友</h2><label><span class="sr-only">搜索角色</span><input id="search" type="search" placeholder="找一位朋友" autocomplete="off"></label></div>
      <div id="characters" class="characters"></div><p id="empty" hidden>还没有找到这个名字，试试另一个吧。</p>
      <p class="note">42 位故事 NPC · 叫叫、铃铛和猪小弟已在《送豆豆回家》中登场，其余朋友收录于角色库。</p>
    </section>
  </main>
  <script type="module" src="./src/story-npcs/gallery.js?v=20260906-npc42"></script>
</body>
</html>
