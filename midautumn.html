<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#1a2944"><meta name="description" content="走进月光下的中秋小世界。说出 moon、mooncake、lantern，让兔子和你的想象一起过节。">
  <title>月亮的中秋夜 · 萌萌星</title><link rel="icon" href="/favicon.ico">
  <link rel="preload" href="/assets/fonts/MohrRounded-Bold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/src/voice-input-control.css"><link rel="stylesheet" href="/dev/words.css?v=07dff7a86223">
</head>
<body data-festival="midautumn">
  <main class="word-layout" data-view="play">
    <div id="word-stage" aria-label="月亮的中秋夜立体场景；点一下场景可听引导"></div>
    <div class="scene-shade" aria-hidden="true"></div>
    <header class="word-header"><button id="change-age" class="quiet-button" hidden></button><button id="word-music" class="quiet-button music-button" aria-label="关闭背景音乐"></button></header>
    <div class="world-title" aria-hidden="true"><h1 id="world-title"></h1><p id="world-subtitle"></p></div>
    <section id="word-panel" aria-label="英语冒险"></section>
    <p id="webgl-error" role="alert" hidden>立体场景暂时没有打开，请换一个支持 3D 的浏览器再试。</p>
    <div id="world-feedback" class="sr-only" aria-live="polite"></div>
    <button id="clear-world" class="quiet-button retry-button" aria-label="重新布置" title="重新布置" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2.7 7M3 4v7h7"/></svg></button>
  </main>
  <noscript>请启用 JavaScript 后开始英语冒险。</noscript>
  <script type="module" src="/dev/words.bundle.js?v=1aaf6d83bf52"></script>
</body></html>
