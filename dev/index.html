<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3ecdf">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="在萌萌星的立体小世界里，和新伙伴一起听故事、想办法。">
  <title>萌萌星 · 立体故事工坊</title>
  <link rel="icon" href="../favicon.ico">
  <link rel="stylesheet" href="./app.css?v=97e3e62b17f1">
  <link rel="stylesheet" href="./immersive.css?v=20260918-modular">
  <link rel="stylesheet" href="./exploration.css?v=e275e6ee8893">
  <link rel="stylesheet" href="../src/voice-input-control.css?v=20260917-gugu-full">
</head>
<body data-view="story">
  <header class="topbar">
    <a href="../" id="home-link" class="icon-control" aria-label="返回萌萌星首页"><i data-lucide="house"></i></a>
    <a class="wordmark" href="../">萌萌星<span>奇妙图鉴</span></a>
    <div class="story-tools" id="story-tools" hidden>
      <button id="open-story-menu" class="icon-control" aria-label="故事菜单" aria-expanded="false" aria-controls="story-menu"><svg class="more-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="19" cy="12" r="1.7"></circle></svg></button>
      <div id="story-menu" class="story-menu" role="group" aria-label="故事工具" hidden>
        <p id="objective"></p>
        <button id="bag-button" class="quiet-button" aria-haspopup="dialog">小小背包 <span id="bag-count">0</span></button>
        <button id="scene-reset" class="quiet-button">回到伙伴身边</button>
        <button id="restart" class="quiet-button" aria-label="重新开始当前故事">重新开始</button>
      </div>
    </div>
  </header>

  <main id="experience">
    <div class="world-viewport" id="world-viewport">
      <div id="stage" class="stage"></div>
      <div class="stage-loading" id="stage-loading"><span></span><p>小世界正在展开</p></div>
      <div class="scene-caption" id="scene-caption" hidden><span id="chapter-name"></span><h1 id="scene-title"></h1></div>
      <button class="camera-reset" id="camera-reset" aria-label="恢复正面视角">回到伙伴</button>
      <p class="stage-hint" id="stage-hint">轻轻转动世界 · 和伙伴打个招呼</p>
    </div>

    <section class="story-panel" id="story-panel" hidden>
      <button type="button" class="speech-card" id="speech-card" aria-label="听角色说话，轻点可跳过这一句">
        <span class="speaker" id="speaker"></span>
        <span class="speech-text" id="speech-text" aria-live="polite"></span>
        <span class="speaking-bars" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
      <div class="story-start" id="story-start"><button class="primary" id="start-story">开始对话</button><p id="resume-note"></p></div>
      <p id="heard" aria-live="polite" hidden></p>
      <div class="answer-dock" id="answer-dock" hidden>
        <div class="answer-controls">
          <button type="button" id="mic-button" data-state="setup" aria-label="打开麦克风回答" aria-pressed="false"></button>
          <button class="reply-more" id="reply-more" aria-label="更多回答方式" aria-expanded="false" aria-controls="reply-options"><span aria-hidden="true">···</span></button>
        </div>
        <p id="voice-feedback" role="status" hidden></p>
        <div class="reply-options" id="reply-options" role="group" aria-label="其他回答方式" hidden>
          <div class="reply-tabs">
            <button class="quiet-button" id="show-choices" aria-expanded="false" aria-controls="choices">看看办法</button>
            <button class="quiet-button" id="show-text" aria-expanded="false" aria-controls="text-form">写下来</button>
            <button class="quiet-button" id="close-replies" aria-label="收起回答方式">收起</button>
          </div>
          <div class="choices" id="choices" hidden></div>
          <form id="text-form" class="text-form" hidden><label for="answer-input" class="sr-only">你的想法</label><input id="answer-input" maxlength="180" placeholder="把你的想法写在这里" autocomplete="off" enterkeyhint="send"><button class="primary" type="submit">告诉它</button></form>
        </div>
      </div>
      <div id="creation-review" class="creation-review" hidden><button id="creation-again" class="primary" type="button">再造一件 / 改一改</button><button id="creation-next" class="secondary" type="button">带着发现去下一站</button></div>
      <div class="ending" id="ending" hidden><h2 id="ending-title"></h2><p id="ending-text"></p><blockquote id="ending-line"></blockquote><button id="save-memory" class="primary">收进我的图鉴</button><a id="journey-next" href="./debate" class="primary" hidden>带着好奇，去听不同的想法</a><button id="return-creating" class="primary" type="button" hidden>继续创造这个世界</button><a href="../" class="quiet-button">回到萌萌星首页</a></div>
    </section>

    <section class="studio-panel" id="studio-panel" hidden>
      <h1>角色模拟器</h1><p class="panel-intro">转一转，捏一捏，看看它怎样表达。</p>
      <div class="studio-tabs" role="tablist" aria-label="角色编辑"><button role="tab" id="tab-character" data-tab="character" aria-selected="true" aria-controls="character-controls">伙伴</button><button role="tab" id="tab-performance" data-tab="performance" aria-selected="false" aria-controls="performance-controls">表演</button><button role="tab" id="tab-world" data-tab="world" aria-selected="false" aria-controls="world-controls">场景</button></div>
      <div id="character-controls" role="tabpanel" aria-labelledby="tab-character">
        <div id="character-types" class="type-grid"></div>
        <label class="field-label" for="character-name">伙伴昵称</label><input id="character-name" maxlength="10" value="小团" autocomplete="off">
        <fieldset class="color-field"><legend>换一身颜色</legend><div id="color-swatches" class="color-swatches"></div></fieldset>
        <label class="slider-label" for="character-size">高矮 <output id="size-output">100%</output></label><input id="character-size" type="range" min="75" max="125" value="100">
      </div>
      <div id="performance-controls" role="tabpanel" aria-labelledby="tab-performance" hidden><p class="field-label">此刻的表情</p><div class="control-grid" id="expressions"></div><p class="field-label">让它动起来</p><div class="control-grid" id="actions"></div><button class="secondary full" id="preview-voice">听它打个招呼</button></div>
      <div id="world-controls" role="tabpanel" aria-labelledby="tab-world" hidden><div id="world-options" class="world-options"></div></div>
      <div class="studio-actions"><button id="save-character" class="primary">保存伙伴</button><button id="download-character" class="secondary">导出模型</button></div>
      <div id="saved-characters" class="saved-characters"></div>
    </section>
  </main>

  <dialog id="bag-dialog"><div class="dialog-top"><h2>一路带着的东西</h2><button class="quiet-button" id="close-bag" autofocus>关闭</button></div><div id="bag-content"></div></dialog>
  <div id="notice" class="notice" role="status" aria-live="polite"></div>
  <div id="transition" class="transition" aria-hidden="true"></div>
  <script type="module" src="./app.bundle.js?v=b23a0afd9447"></script>
  <script type="module" src="../src/anonymous-identity.js?v=20260920-users"></script>
</body>
</html>
