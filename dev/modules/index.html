<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f3ee"><title>萌萌星 · 模块陈列馆</title><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="./gallery.css?v=aa641536d341"><link rel="stylesheet" href="../exploration.css?v=e275e6ee8893"><link rel="stylesheet" href="/src/voice-input-control.css"><script type="module" src="./gallery.bundle.js?v=bcbbc12ecf70"></script></head>
<body>
<header><a href="/" class="home">← 萌萌星</a><span>世界工坊 / 模块陈列馆</span></header>
<main>
  <div class="intro"><h1>模块陈列馆</h1><p id="catalog-summary" class="muted"></p></div>
  <div class="catalog-layout">
    <aside class="catalog-sidebar"><button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="收起模块栏" aria-expanded="true">收起模块栏</button><div class="search-shell"><input id="module-search" type="search" placeholder="风车、对话、存档、音乐…" autocomplete="off"><button id="search-submit" type="button" aria-label="搜索模块">⌕</button></div><nav id="filters" aria-label="模块类型"></nav><div id="module-list" aria-label="模块目录"></div><button id="load-more" type="button" hidden>再显示一些</button></aside>
    <section class="detail" aria-label="模块详情"><p id="module-kind" class="eyebrow"></p><h2 id="module-name"></h2><p id="module-description"></p><div id="preview-stage" class="preview-stage" aria-label="3D 模块预览"></div><section id="command-panel" class="control-frame" hidden><div class="natural-command"><label for="natural-command-input">一句话控制场景</label><div><input id="natural-command-input" placeholder="例如：变出来10个好奇火箭" maxlength="180"><button id="natural-command-submit" type="button">提交</button></div><p id="natural-command-status" role="status"></p></div><div id="control-tabs" class="control-tabs" role="tablist" aria-label="场景控制记录"></div><textarea id="command-input" spellcheck="false" aria-label="结构化世界提案"></textarea><div class="controls"><button id="apply-proposal" type="button">应用这份提案</button><button id="refresh-proposal" type="button">生成当前场景提案</button></div><pre id="runtime-report" aria-live="polite"></pre></section><audio id="audio-preview" controls preload="none" hidden></audio><div id="preview-ui" class="preview-ui" hidden></div><div id="preview-controls" class="controls"></div><p id="preview-status" role="status" aria-live="polite"></p><div id="capabilities" class="capabilities"></div><p class="source-line"><code id="module-id"></code><a id="module-source" target="_blank" rel="noopener">查看源文件 ↗</a></p>
    <details><summary>后续怎么维护</summary><p>剧情与对白修改 <code>dev/content/stories/</code>；新道具放到 <code>dev/modules/props/</code> 并注册能力；新界面或逻辑补充 <code>dev/modules/catalog.js</code>。构建会自动刷新音频与模块清单，检查会核对目录、模型和源码是否齐全。</p><a href="https://github.com/yanghaoleng/JOJO-Mysterious-Album/blob/main/dev/ARCHITECTURE.md" target="_blank" rel="noopener">完整架构与扩展示例 ↗</a></details>
    </section>
  </div>
</main><footer>陈列馆与游戏共用真实模块 · 声音只在你按下播放时加载</footer>
</body></html>
