<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f0"><meta name="robots" content="noindex,nofollow">
  <title>iPhone Duo · 黄色四巨头</title>
  <link rel="icon" href="../../favicon.ico"><link rel="stylesheet" href="./style.css">
</head>
<body data-fold="closed">
  <header><a href="../yellow-four.html" class="back">↖ 黄色四巨头</a><span>萌萌星 · DEVICE STUDY 01</span></header>
  <main>
    <div class="intro"><p class="eyebrow">iPhone Duo</p><h1>一展开，<br class="mobile-break">快乐就到齐。</h1><p id="caption">叫叫先来打个招呼。</p></div>
    <section id="viewport" aria-label="iPhone Duo 立体折叠视图">
      <div id="loading" role="status"><span class="loader"></span><p>叫叫正在准备一个惊喜…</p></div>
    </section>
    <div class="dock">
      <div class="fold-label"><span id="state-label" role="status" aria-live="polite">合起 · 叫叫</span><output id="angle-output" for="angle">0°</output></div>
      <input id="angle" type="range" min="0" max="180" step="1" value="0" aria-label="展开角度" aria-valuetext="合起，只有叫叫" disabled>
      <div class="actions"><button id="toggle" class="primary" aria-expanded="false" aria-controls="viewport" disabled><span id="toggle-label">展开，四巨头集合</span><span aria-hidden="true">↔</span></button><button id="reset" aria-label="恢复正面视角" title="恢复正面视角" disabled>↺</button></div>
      <p class="hint">拖动转一转 · 滑动控制展开</p>
    </div>
  </main>
  <footer><span>一个颜色，四种可爱。</span><a href="https://github.com/chuspeeism/iphone-duo" target="_blank" rel="noopener noreferrer">基于 iPhone Duo ↗</a></footer>
  <script type="module" src="./app.bundle.js"></script>
</body>
