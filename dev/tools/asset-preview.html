<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原创陶土角色 · 资产预览</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#e8e4da;color:#3d443d;font-family:ui-sans-serif,system-ui,sans-serif}header{position:fixed;top:28px;left:36px;z-index:2}h1{font-size:24px;margin:0 0 8px;letter-spacing:.03em}p{margin:0;color:#777f75;font-size:13px}canvas{display:block;width:100vw;height:100vh}footer{position:fixed;bottom:32px;left:5%;width:90%;display:flex;justify-content:space-around;font-size:14px;color:#53604f}button{position:fixed;top:30px;right:32px;z-index:3;border:1px solid #bdc4b5;border-radius:20px;padding:10px 18px;background:#f8f7ef;color:#485746;cursor:pointer}
</style>
<header><h1>小小陶土剧场</h1><p>七位新朋友 · 原创实体模型</p></header>
<button id="turn">看看背面</button>
<footer></footer>
<script type="module">
import * as THREE from '../../vendor/three.module.js';
import {CHARACTER_CATALOG,createCharacter} from '../models.js';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.3;
document.body.append(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color('#e8e4da');
const camera=new THREE.PerspectiveCamera(31,innerWidth/innerHeight,.1,100);
camera.position.set(0,6.1,17); camera.lookAt(0,.9,0);
scene.add(new THREE.HemisphereLight('#fff9e5','#818c78',2.4));
const sun=new THREE.DirectionalLight('#ffebcd',4.2);sun.position.set(-3,7,6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-9;sun.shadow.camera.right=9;sun.shadow.camera.top=5;sun.shadow.camera.bottom=-5;sun.shadow.normalBias=.02;sun.shadow.bias=-.0003;sun.shadow.radius=3;scene.add(sun);
const rim=new THREE.DirectionalLight('#dfeeff',2);rim.position.set(5,4,-4);scene.add(rim);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:'#e8e4da',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.02;floor.receiveShadow=true;scene.add(floor);
const characters=CHARACTER_CATALOG.map((entry,index)=>{const model=createCharacter({type:entry.id});model.group.position.x=(index-3)*1.77;model.group.rotation.y=.10;scene.add(model.group);const label=document.createElement('span');label.textContent=entry.name;document.querySelector('footer').append(label);return model;});
let targetAngle=.10;
document.querySelector('#turn').onclick=()=>{targetAngle=targetAngle<1?Math.PI+.4:.10;document.querySelector('#turn').textContent=targetAngle<1?'看看背面':'看看正面';};
window.models=characters;window.renderer=renderer;
let last=0;
function render(ms){const time=ms/1000,dt=Math.min(.05,time-last);last=time;characters.forEach((model,index)=>{model.update(time+index*.31,dt);model.group.rotation.y=THREE.MathUtils.lerp(model.group.rotation.y,targetAngle,.05);});renderer.render(scene,camera);requestAnimationFrame(render);}
requestAnimationFrame(render);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</html>
