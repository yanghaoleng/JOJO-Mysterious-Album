server {
    listen 80;
    listen [::]:80;
    server_name jma.mikeywa.site;

    root /opt/kindergrimm/current;
    index index.html;
    charset utf-8;
    client_max_body_size 64k;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8137;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 8s;
        proxy_read_timeout 50s;
        add_header Cache-Control "no-store" always;
    }

    location = /Data {
        try_files /data.html =404;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location ~* \.(?:mp3|png|jpg|jpeg|webp|gif|svg|woff2)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location ~* \.(?:js|css)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(), camera=(), geolocation=()" always;
}
