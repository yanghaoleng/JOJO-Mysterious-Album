# Include inside jma.mikeywa.site's server. Only this activity admits CyberJOJO.
location = /words {
    try_files /words.html =404;
    add_header Cache-Control "no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://cyberjojo.mikeywa.site" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
}
