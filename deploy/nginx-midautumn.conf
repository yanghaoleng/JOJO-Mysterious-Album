# Enable the HTTPS block after DNS points here and certbot has issued this name.
server {
    listen 80;
    listen [::]:80;
    server_name midautumn.mikeywa.site;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name midautumn.mikeywa.site;

    ssl_certificate /etc/letsencrypt/live/midautumn.mikeywa.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/midautumn.mikeywa.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /opt/kindergrimm/current;
    charset utf-8;
    client_max_body_size 2m;

    location = / {
        try_files /midautumn.html =404;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location = /api/word-realtime {
        proxy_pass http://127.0.0.1:8137;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 8s;
        proxy_read_timeout 60s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8137;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 8s;
        proxy_read_timeout 50s;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri =404;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
}
