<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f1ead8">
  <title>画面风格编辑器 · 萌萌星的奇妙图鉴</title>
  <link rel="icon" href="./favicon.ico?v=20260829-soft-corner" sizes="any">
  <link rel="icon" type="image/png" sizes="512x512" href="./assets/icons/favicon-star-speech.png?v=20260829-soft-corner">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon.png?v=20260829-square-master">
  <link rel="stylesheet" href="./src/app-navigation.css?v=20260828-style-editor-v2">
  <link rel="stylesheet" href="./src/style-editor.css?v=20260831-default-drawn">
</head>
<body data-analytics-page="style-editor">
  <nav id="style-navigation"></nav>

  <header class="editor-header">
    <p class="eyebrow">角色模拟器工具</p>
    <h1>画面风格编辑器</h1>
    <p>人物与背景分开调整。你可以先用整排角色检查线条、光影和投影，再单独控制背景的色彩、颗粒与远近感。</p>
  </header>

  <main>
    <section class="preview-panel" aria-labelledby="preview-title">
      <div class="preview-heading">
        <div>
          <p class="section-kicker">多人实时预览</p>
          <h2 id="preview-title">一整排角色</h2>
        </div>
        <span id="working-version" class="version-pill">默认手绘版</span>
      </div>
      <div id="preview-scroll" class="preview-scroll" tabindex="0" aria-label="可左右拖动的角色风格预览">
        <div id="preview-track" class="preview-track">
          <canvas id="style-preview-background" aria-hidden="true"></canvas>
          <canvas id="style-preview" aria-label="六个角色的画面风格实时预览"></canvas>
          <div class="preview-labels" aria-hidden="true">
            <span>豆豆小狗</span>
            <span>月牙小猫</span>
            <span>雪团小兔</span>
            <span>蜜糖小熊</span>
            <span>卷尾小狐狸</span>
            <span>河湾小水獭</span>
          </div>
          <p id="preview-loading" class="preview-loading">正在画出整排角色</p>
        </div>
      </div>
      <p class="preview-note">在角色上横向拖动，或使用滚轮查看整排角色。人物参数只重画人物，背景参数只调整背景。</p>
      <div class="preview-actions">
        <button id="open-save" class="secondary-button" type="button">保存为我的版本</button>
        <button id="apply-style" class="primary-button" type="button">应用到所有页面</button>
      </div>
    </section>

    <section class="control-panel" aria-labelledby="control-title">
      <div class="panel-heading">
        <div>
          <p class="section-kicker">基础画面元素</p>
          <h2 id="control-title">手动调整</h2>
        </div>
        <button id="reset-current" class="quiet-button" type="button">重置当前</button>
      </div>
      <div class="scope-tabs" role="tablist" aria-label="调整对象">
        <button class="scope-tab is-active" type="button" role="tab" aria-selected="true" data-style-scope="character">人物风格</button>
        <button class="scope-tab" type="button" role="tab" aria-selected="false" data-style-scope="background">背景风格</button>
      </div>
      <div id="style-controls" class="style-controls"></div>
    </section>

    <section class="version-section" aria-labelledby="version-title">
      <div class="version-heading">
        <div>
          <p class="section-kicker">服务器版本库</p>
          <h2 id="version-title">选择一个版本继续调整</h2>
        </div>
        <div class="version-tabs" role="tablist" aria-label="版本分类">
          <button class="version-tab is-active" type="button" role="tab" aria-selected="true" data-version-filter="official">官方预设</button>
          <button class="version-tab" type="button" role="tab" aria-selected="false" data-version-filter="github">GitHub 社区</button>
          <button class="version-tab" type="button" role="tab" aria-selected="false" data-version-filter="custom">我的版本</button>
        </div>
      </div>
      <div id="version-library" class="version-library" aria-live="polite">
        <div class="library-state">正在从服务器读取版本</div>
      </div>
    </section>
  </main>

  <dialog id="save-dialog" class="save-dialog">
    <form id="save-form" method="dialog">
      <div class="dialog-heading">
        <div>
          <p class="section-kicker">存进服务器</p>
          <h2>保存为我的版本</h2>
        </div>
        <button id="close-save" class="icon-close" type="button" aria-label="关闭保存窗口">×</button>
      </div>
      <label>
        <span>版本名称</span>
        <input id="style-name" name="name" required minlength="2" maxlength="28" placeholder="例如：圆润蜡笔版">
      </label>
      <label>
        <span>创作者</span>
        <input id="style-author" name="author" maxlength="20" placeholder="不填则显示匿名创作者">
      </label>
      <label>
        <span>一句说明</span>
        <textarea id="style-description" name="description" maxlength="100" rows="3" placeholder="这套风格最特别的地方"></textarea>
      </label>
      <p id="save-status" class="save-status" role="status"></p>
      <button id="submit-style" class="primary-button" type="submit">保存到我的版本</button>
    </form>
  </dialog>

  <div id="editor-toast" class="editor-toast" role="status" aria-live="polite"></div>

  <script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
  <script type="module" src="./src/analytics.js"></script>
  <script type="module" src="./src/style-editor.js?v=20260831-default-drawn"></script>
</body>
</html>
