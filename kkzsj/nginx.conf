# Include inside the existing mikeywa.site HTTPS server.
location = /kkzsj {
    proxy_pass http://127.0.0.1:8854;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    add_header Cache-Control "no-store" always;
}
location ^~ /kkzsj/ {
    proxy_pass http://127.0.0.1:8854;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    client_max_body_size 2m;
    proxy_read_timeout 120s;
    add_header Cache-Control "no-store" always;
}
location = /kkzsj/api/word-realtime {
    proxy_pass https://jma.mikeywa.site/api/word-realtime;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Host jma.mikeywa.site;
    proxy_set_header Origin https://jma.mikeywa.site;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Cookie "";
    proxy_read_timeout 3600s;
}
location = /kkzsj/api/tts {
    proxy_pass https://jma.mikeywa.site/api/tts;
    include /etc/nginx/snippets/kkzsj-speech-proxy.conf;
}
location = /kkzsj/api/asr {
    proxy_pass https://jma.mikeywa.site/api/asr;
    include /etc/nginx/snippets/kkzsj-speech-proxy.conf;
}
location = /kkzsj/api/scene-control {
    proxy_pass https://jma.mikeywa.site/api/scene-control;
    include /etc/nginx/snippets/kkzsj-speech-proxy.conf;
}
